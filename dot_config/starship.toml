# Managed by chezmoi. Prompt for terminals outside a Claude session.
#
# Design rule: NOTHING here may make a network call. The prompt renders on every
# keystroke-return, so anything hitting the Linear or GitHub API would make the
# shell feel broken. The Linear ticket below comes from the branch name, which
# is local and instant — live ticket state deliberately does not appear.

format = """
$directory$git_branch$custom$git_status$python$nodejs
$character"""

add_newline = true
command_timeout = 500

[directory]
truncation_length = 3
truncate_to_repo = false
style = "bold cyan"

[git_branch]
symbol = " "
style = "bold purple"
format = "on [$symbol$branch]($style) "
truncation_length = 24

# Surfaces the Linear ticket encoded in the branch name — silverbeer/sb-407-... → SB-407.
# `when` gates on the branch actually matching, so non-ticket branches (main,
# detached HEAD) render nothing rather than an empty box.
[custom.linear]
description = "Linear ticket id parsed from the branch name"
command = "git branch --show-current | grep -oE 'sb-[0-9]+' | tr '[:lower:]' '[:upper:]'"
when = "git branch --show-current 2>/dev/null | grep -qE 'sb-[0-9]+'"
shell = ["bash", "--noprofile", "--norc"]
format = "[$output]($style) "
style = "bold yellow"

[git_status]
style = "bold red"
format = '([$all_status$ahead_behind]($style) )'

[python]
symbol = " "
format = "[$symbol$version]($style) "
style = "bold green"

[nodejs]
symbol = " "
format = "[$symbol$version]($style) "
style = "bold green"
# Only in projects that actually are Node — avoids a version badge in every repo.
detect_files = ["package.json", ".node-version"]
detect_folders = []

[character]
success_symbol = "[❯](bold green)"
error_symbol = "[❯](bold red)"

# Kept off deliberately: these shell out to cloud CLIs or scan large trees and
# are the usual cause of a sluggish prompt.
[aws]
disabled = true
[gcloud]
disabled = true
[kubernetes]
disabled = true
[docker_context]
disabled = true
[package]
disabled = true
